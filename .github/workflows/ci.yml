name: CI

on:
  push:
    # release/** is included so a release branch is verified by CI before it is
    # merged and tagged. Tags are immutable once the Go module proxy caches them,
    # so tagging must never be the first time CI sees the change.
    branches: [master, 'release/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
